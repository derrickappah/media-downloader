<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <img src="../icons/icon32.png" alt="Logo" class="logo-img">
        <div class="title-wrap">
          <h1>Media Downloader</h1>
          <span class="site-domain" id="siteDomain" title="Current website">Scanning...</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="deepScanBtn" class="action-btn" title="Scroll page to capture lazy-loaded assets">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="7 13 12 18 17 13"></polyline>
            <polyline points="7 6 12 11 17 6"></polyline>
          </svg>
          Deep Scan
        </button>
        <button id="rescanBtn" class="icon-btn" title="Refresh scan">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme">
          <!-- Sun icon (shown in dark mode to switch to light) -->
          <svg id="themeIconSun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon icon (shown in light mode to switch to dark) -->
          <svg id="themeIconMoon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Drawer -->
    <div id="settingsDrawer" class="settings-drawer hidden">
      <div class="setting-item">
        <label for="subfolderToggle" class="switch-label">
          <span>Save to Website Subfolder</span>
          <small class="setting-hint">Downloads/Media_domain.com/</small>
        </label>
        <input type="checkbox" id="subfolderToggle" checked>
      </div>
      <div class="setting-item">
        <label for="minDimFilter">Filter Small Assets:</label>
        <select id="minDimFilter" class="select-input">
          <option value="0" selected>Show All Sizes</option>
          <option value="64">&gt; 64 x 64 px (hide tiny icons)</option>
          <option value="200">&gt; 200 x 200 px (medium &amp; large)</option>
          <option value="500">&gt; 500 x 500 px (large only)</option>
          <option value="1000">&gt; 1000 x 1000 px (HD only)</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="themeSelect">Theme / Appearance:</label>
        <select id="themeSelect" class="select-input">
          <option value="dark">Dark Theme</option>
          <option value="light">Light Theme</option>
          <option value="system">System Default</option>
        </select>
      </div>
    </div>

    <!-- Search and Filter Tabs -->
    <section class="filter-section">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search by name, extension, or URL...">
        <button id="clearSearchBtn" class="clear-btn hidden">&times;</button>
      </div>

      <nav class="category-tabs" id="categoryTabs">
        <button class="tab active" data-type="all">All <span class="badge" id="countAll">0</span></button>
        <button class="tab" data-type="image">Images <span class="badge" id="countImages">0</span></button>
        <button class="tab" data-type="video">Videos <span class="badge" id="countVideos">0</span></button>
        <button class="tab" data-type="audio">Audio <span class="badge" id="countAudio">0</span></button>
        <button class="tab" data-type="svg">Vectors <span class="badge" id="countSvg">0</span></button>
        <button class="tab" data-type="stream">Streams <span class="badge" id="countStream">0</span></button>
      </nav>
    </section>

    <!-- Bulk Action Bar -->
    <section class="bulk-action-bar">
      <label class="select-all-label">
        <input type="checkbox" id="selectAllCheckbox">
        <span id="selectionStatus">Select All</span>
      </label>
      <div class="bulk-buttons">
        <button id="exportCsvBtn" class="action-outline-btn" title="Export media list to CSV">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          CSV
        </button>
        <button id="copyLinksBtn" class="action-outline-btn" title="Copy URLs">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Links
        </button>
        <button id="downloadZipBtn" class="action-outline-btn" disabled title="Download selected as a ZIP archive">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          ZIP
        </button>
        <button id="downloadSelectedBtn" class="primary-btn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download (<span id="selectedCount">0</span>)
        </button>
      </div>
    </section>

    <!-- Media Grid Container -->
    <main class="media-container" id="mediaContainer">
      <div class="state-placeholder" id="loadingState">
        <div class="spinner"></div>
        <p id="loadingText">Scanning page for media...</p>
      </div>
      <div class="state-placeholder hidden" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h3>No media found</h3>
        <p>Click <strong>Deep Scan</strong> to trigger lazy assets, or adjust filter settings.</p>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span id="toastMsg">Downloading...</span>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal hidden">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-topbar">
          <div class="zoom-controls hidden" id="zoomControls">
            <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">−</button>
            <span id="zoomLevelText">100%</span>
            <button id="zoomInBtn" class="zoom-btn" title="Zoom In">+</button>
            <button id="zoomResetBtn" class="zoom-btn" title="Reset Zoom">Reset</button>
          </div>
          <button class="modal-close" id="modalCloseBtn">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <div class="modal-info">
            <span id="modalFilename" class="modal-title"></span>
            <span id="modalMeta" class="modal-meta"></span>
          </div>
          <div class="modal-actions">
            <button id="modalCopyUrlBtn" class="action-outline-btn">Copy Link</button>
            <button id="modalDownloadBtn" class="primary-btn">Download</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../libs/zip-builder.js"></script>
  <script src="popup.js"></script>
</body>
</html>
